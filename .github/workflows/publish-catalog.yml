name: Publish TeBiCamp catalog and photos

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_catalog.py'
      - '.github/workflows/publish-catalog.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror catalog photos and export public data
        run: python scripts/sync_catalog.py
      - name: Commit mirrored catalog to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js assets/catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync public caravan catalog and locally hosted photos'
            git push
          fi
